# ROTOR RAIDER sound (by Paul Ross Seibert). Reference: agk help-sound
# Paula channel 2 is the rotor: main.c drives it directly (a looped chop whose
# pitch follows the airspeed). Music plays on 0, 1, 3 (title, jingles); in
# play there's no music, and effects have channels 1 and 3.

[sound]
sfx_channels = [1, 3]

[sfx.cannon]              # the chin gun: a short punchy crack
wave = "noise"
freq = [5200, 1400]
length = 0.08
decay = 26
volume = 44
priority = 1

[sfx.bomb]                # a bomb falling away: a whistle down
wave = "triangle"
freq = [2000, 420]
length = 0.3
decay = 2
volume = 34
priority = 2

[sfx.boom]                # a small explosion: a round hits, a turret goes
wave = "noise"
freq = [1800, 300]
length = 0.28
decay = 8
volume = 52
priority = 2

[sfx.bigboom]             # a bomb, a plane, a ship: a long rumble
wave = "noise"
freq = [1200, 90]
length = 0.5
decay = 3
volume = 64
priority = 4

[sfx.flak]                # flak bursting: a dull pop
wave = "noise"
freq = [900, 400]
length = 0.1
decay = 18
volume = 40
priority = 1

[sfx.missile]             # a missile launched: a rising hiss
wave = "noise"
freq = [1500, 6000]
length = 0.25
attack = 0.05
decay = 3
volume = 40
priority = 3

[sfx.hit]                 # the gunship takes a hit: a metal clang
wave = "square"
steps = [[220, 0.03], [185, 0.05], [147, 0.08]]
decay = 10
volume = 50
priority = 4

[sfx.land]                # skids on the deck
wave = "noise"
freq = 420
length = 0.08
decay = 30
volume = 40
priority = 1

[sfx.klaxon]              # the cruiser has sailed: an alarm
wave = "square"
steps = [[523, 0.1], [415, 0.1], [523, 0.1], [415, 0.1]]
decay = 1
volume = 46
priority = 5

[sfx.factory]             # a factory down: a bright sting
wave = "pulse25"
steps = [[784, 0.05], [988, 0.05], [1175, 0.05], [1568, 0.14]]
decay = 5
volume = 44
priority = 5

[sfx.crash]               # the gunship goes down
wave = "noise"
freq = [3000, 100]
length = 0.5
decay = 2
volume = 64
priority = 6

[sfx.start]               # fire on the title
wave = "square"
steps = [[659, 0.06], [988, 0.06], [1319, 0.12]]
decay = 5
volume = 44
priority = 3

[music.theme]
source = "theme.mml"
volume = 50

[music.fanfare]
source = "fanfare.mml"
volume = 52

[music.gameover]
source = "gameover.mml"
volume = 50
